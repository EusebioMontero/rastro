<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0E5A8A"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>Rastro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Concepto: cuaderno de taller sobre papel de delineante. Una columna estrecha pensada para el móvil, pestañas abajo, visor con marcas de recorte y muestras de material como fichas. */
:root{
  --bg:#E8EDEF;
  --surface:#F5F8F9;
  --ink:#10212B;
  --ink-2:#506570;
  --line:#B7C5CC;
  --grid:rgba(16,33,43,.06);
  --accent:#0E5A8A;
  --on-accent:#FFFFFF;
  --hi:#E5AE00;
  --on-hi:#1A1400;
  --bad:#B3361F;
  --good:#1C7A4B;
  --f-display:'Big Shoulders Display','Arial Narrow',Impact,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1B28;--surface:#102636;--ink:#E3EEF4;--ink-2:#8DA8B7;--line:#244559;
    --grid:rgba(160,205,230,.07);--accent:#63B8EA;--on-accent:#06202F;--hi:#F0C23A;--on-hi:#1A1400;
    --bad:#FF8C75;--good:#6FD9A0;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1B28;--surface:#102636;--ink:#E3EEF4;--ink-2:#8DA8B7;--line:#244559;
  --grid:rgba(160,205,230,.07);--accent:#63B8EA;--on-accent:#06202F;--hi:#F0C23A;--on-hi:#1A1400;
  --bad:#FF8C75;--good:#6FD9A0;color-scheme:dark;
}

html,body{min-height:100%}
body{
  background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font:15px/1.5 var(--f-body);
}
*{box-sizing:border-box}
h1,h2,h3,p,ul{margin:0}
button{font-family:inherit}

.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 calc(88px + env(safe-area-inset-bottom,0px))}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);margin-inline:-16px;padding:12px 16px 10px;border-bottom:1px solid var(--line);display:grid;gap:8px}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{font:800 28px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.logo{width:24px;height:24px;flex:none}
.logo path{fill:none;stroke:var(--accent);stroke-width:2.4}
.logo rect{fill:var(--hi)}
.save{margin-left:auto;font:500 11px var(--f-mono);color:var(--ink-2);display:flex;align-items:center;gap:6px}
.save::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ink-2)}
.save[data-s="ok"]::before{background:var(--good)}
.save[data-s="err"]{color:var(--bad)}
.save[data-s="err"]::before{background:var(--bad)}
.lvl{display:flex;align-items:center;gap:10px;font:500 12px var(--f-mono);color:var(--ink-2);white-space:nowrap}
.lvl #lvl{color:var(--ink);font-weight:600}
.bar{flex:1;min-width:40px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--hi);transition:width .4s ease}

.view{display:grid;gap:14px;padding-top:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.sec-h h2{font:800 30px/1 var(--f-display);letter-spacing:.06em;text-transform:uppercase}
.mono{font:500 12px var(--f-mono);color:var(--ink-2)}

/* Visor */
.vf{position:relative;aspect-ratio:4/3;max-width:100%;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:grid;place-items:center}
.vf img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.vf .c{position:absolute;width:24px;height:24px;border:0 solid var(--accent);z-index:2}
.vf .tl{top:10px;left:10px;border-top-width:3px;border-left-width:3px}
.vf .tr{top:10px;right:10px;border-top-width:3px;border-right-width:3px}
.vf .bl{bottom:10px;left:10px;border-bottom-width:3px;border-left-width:3px}
.vf .br{bottom:10px;right:10px;border-bottom-width:3px;border-right-width:3px}
.vf .hint{display:grid;gap:4px;text-align:center;padding:0 40px;color:var(--ink-2)}
.vf .hint b{font:800 22px/1 var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.vf .hint span{font:500 12px var(--f-mono)}
.vf.scan::after{content:"";position:absolute;left:0;right:0;top:6%;height:2px;background:var(--hi);box-shadow:0 0 14px 4px var(--hi);z-index:3;animation:sweep 1.5s ease-in-out infinite alternate}
@keyframes sweep{from{top:6%}to{top:94%}}

/* Botones */
.row{display:flex;flex-wrap:wrap;gap:10px}
.btn{flex:1 1 140px;min-height:48px;padding:0 18px;border-radius:var(--r);border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pick{position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
.pick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px;z-index:2}
.pick:focus-within{outline:3px solid var(--hi);outline-offset:2px}
.btn.off{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn:focus-visible,.tab:focus-visible{outline:3px solid var(--hi);outline-offset:2px}

/* Tarjetas */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:12px;min-width:0}
.card h2{font:800 20px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.tips{list-style:none;padding:0;display:grid;gap:4px;color:var(--ink-2);font-size:14px}
.tips li{padding-left:16px;position:relative}
.tips li::before{content:"–";position:absolute;left:0;color:var(--accent);font-family:var(--f-mono)}
.busy{font:800 22px/1.1 var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.sub{color:var(--ink-2);font-size:14px}
.warn{color:var(--bad)}

/* Escala de tamaños */
.ladder{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;align-items:end}
.step{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink-2);text-align:center;min-width:0}
.step .col{width:100%;border:1.5px solid var(--line);border-bottom-width:3px;border-radius:3px 3px 0 0}
.step b{font:800 18px/1 var(--f-display);letter-spacing:.06em;color:var(--ink)}
.step span{font:500 10.5px var(--f-mono);white-space:nowrap}
.step .x{font-size:11px;font-weight:600}
.step.on .col{background:var(--accent);border-color:var(--accent)}
.step.on .x{color:var(--accent)}
.step.on span:not(.x){color:var(--ink)}

/* Resultado */
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill,.sz,.new{font:600 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border:1.5px solid currentColor;border-radius:3px}
.r1{color:var(--ink-2)}
.r2{color:var(--good)}
.r3{color:var(--accent)}
.r4{color:var(--on-hi);background:var(--hi);border-color:var(--hi)}
.sz{color:var(--ink)}
.new{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
.name{font:800 34px/1.02 var(--f-display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;overflow-wrap:anywhere}
.dato{color:var(--ink-2);font-size:14px}
.gains{list-style:none;padding:0;display:grid;gap:8px}
.gains li{display:flex;align-items:center;gap:12px;animation:pop .35s ease both}
.gains li:nth-child(2){animation-delay:.08s}
.gains li:nth-child(3){animation-delay:.16s}
.gains li:nth-child(4){animation-delay:.24s}
@keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.gains .nm{flex:1;min-width:0;font-weight:500}
.gains .qty{font:800 26px/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums;color:var(--accent)}
.calc{font:500 12px/1.5 var(--f-mono);color:var(--ink-2)}
.xp{font:600 12px var(--f-mono);color:var(--ink)}
.lvlup{background:var(--hi);color:var(--on-hi);font:800 18px/1 var(--f-display);letter-spacing:.1em;text-transform:uppercase;padding:10px 12px;border-radius:var(--r)}

/* Muestras de material */
.sw{width:36px;height:36px;border-radius:4px;border:1.5px solid var(--ink);flex:none}
.mat-madera{background:repeating-linear-gradient(90deg,#b07a45 0 6px,#9c6a39 6px 8px,#bb8851 8px 15px)}
.mat-metal{background:linear-gradient(115deg,#8f9ba3 0,#e2e7ea 28%,#9aa6ae 52%,#cfd6da 78%,#8a969e 100%)}
.mat-plastico{background:linear-gradient(135deg,#2d7fd4 0 62%,#6fb0f0 62% 70%,#2d7fd4 70%)}
.mat-vidrio{background:linear-gradient(135deg,#a9dce6 0,#e9f7fa 38%,#8fcbd8 60%,#d5eef3 100%)}
.mat-tela{background:repeating-linear-gradient(0deg,rgba(255,255,255,.18) 0 1px,transparent 1px 4px),repeating-linear-gradient(90deg,rgba(0,0,0,.14) 0 1px,transparent 1px 4px),#b4506a}
.mat-papel{background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(60,90,130,.25) 6px 7px),#efeadb}
.mat-piedra{background:radial-gradient(circle at 20% 30%,#6f6e6a 0 2px,transparent 3px),radial-gradient(circle at 70% 60%,#aaa8a2 0 3px,transparent 4px),radial-gradient(circle at 45% 80%,#6f6e6a 0 2px,transparent 3px),#8e8c86;background-size:16px 16px,22px 22px,14px 14px,auto}
.mat-goma{background:radial-gradient(circle,#4a4d54 0 1.5px,transparent 2px) 0 0/8px 8px,#25272b}
.mat-ceramica{background:linear-gradient(160deg,rgba(255,255,255,.35) 0 18%,transparent 18%),#c2693f}
.mat-electronica{background:linear-gradient(90deg,transparent 0 40%,#7fd6a2 40% 44%,transparent 44%),linear-gradient(0deg,transparent 0 55%,#7fd6a2 55% 59%,transparent 59%),radial-gradient(circle at 70% 30%,#d8b24a 0 3px,transparent 4px),#1f7a4d}
.mat-organico{background:radial-gradient(ellipse at 30% 70%,#8fb852 0 30%,transparent 31%),radial-gradient(ellipse at 75% 35%,#4f7a2c 0 28%,transparent 29%),#6a9a3a}
.mat-cuero{background:radial-gradient(circle,rgba(0,0,0,.25) 0 1px,transparent 1.5px) 0 0/6px 6px,#7a4a2b}

/* Inventario */
.inv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.tile .sample{height:54px;border-bottom:1.5px solid var(--ink)}
.tile .tm{display:flex;justify-content:space-between;align-items:baseline;gap:6px;padding:8px 10px}
.tile .tn{font-weight:500;font-size:14px;min-width:0;overflow-wrap:anywhere}
.tile .tq{font:800 28px/1 var(--f-display);letter-spacing:.03em;font-variant-numeric:tabular-nums}
.tile.zero{opacity:.55}
.tile.zero .sample{filter:grayscale(.85)}

/* Diario */
.log{list-style:none;padding:0;display:grid;gap:10px}
.entry{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:8px;min-width:0}
.entry .top2{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.entry h3{font:800 22px/1.1 var(--f-display);letter-spacing:.04em;text-transform:uppercase;overflow-wrap:anywhere;min-width:0}
.entry .info{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font:500 12px var(--f-mono);color:var(--ink-2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:3px;padding:2px 8px 2px 4px;font:500 12px var(--f-mono)}
.chip i{width:14px;height:14px;border:1px solid var(--ink);border-radius:2px;display:block}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:22px 16px;text-align:center;color:var(--ink-2)}
.empty b{display:block;font:800 20px/1.1 var(--f-display);letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:4px}

/* Pestañas */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
/* Ajustes */
.provs{display:grid;gap:8px}
.prov{display:flex;gap:12px;align-items:flex-start;border:1.5px solid var(--line);border-radius:var(--r);padding:12px;cursor:pointer;background:var(--surface)}
.prov:has(input:checked){border-color:var(--accent)}
.prov input{margin:3px 0 0;accent-color:var(--accent);width:18px;height:18px;flex:none}
.prov b{display:block;font-weight:600}
.prov span{display:block;color:var(--ink-2);font-size:13px}
.prov .tag{display:inline-block;font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--good);margin-left:6px}
.field{display:grid;gap:4px;min-width:0}
.field label{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.field input{min-height:46px;padding:0 12px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--bg);color:var(--ink);font:500 15px var(--f-mono);width:100%}
.field input:focus{outline:none;border-color:var(--accent)}
.note{font-size:13px;color:var(--ink-2)}
.note a{color:var(--accent)}
.ok-msg{font:600 12px var(--f-mono);color:var(--good)}
.tab{background:none;border:0;border-top:3px solid transparent;color:var(--ink-2);padding:8px 4px 10px;min-height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:600;font-size:12px;cursor:pointer}
.tab svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.tab[aria-selected="true"]{color:var(--ink);border-top-color:var(--hi)}

@media (prefers-reduced-motion: reduce){
  .vf.scan::after{animation:none;top:50%}
  .gains li{animation:none}
  .bar i{transition:none}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8V3h5M16 3h5v5M21 16v5h-5M8 21H3v-5"/><rect x="9" y="9" width="6" height="6"/></svg>
      <h1>Rastro</h1>
      <span id="save" class="save" data-s="">Cargando</span>
    </div>
    <div class="lvl"><span id="lvl">Nv 1</span><div class="bar"><i id="bar"></i></div><span id="xp">0 / 20 XP</span><span id="left">Hoy 0/20</span></div>
  </header>

  <main>
    <section id="v-scan" class="view">
      <div class="vf" id="vf">
        <span class="c tl"></span><span class="c tr"></span><span class="c bl"></span><span class="c br"></span>
        <div class="hint" id="vfHint"><b>Encuadra un objeto</b><span>Toca «Cámara»</span></div>
        <img id="pv" alt="Foto del objeto escaneado" hidden>
      </div>
      <div class="row">
        <div class="btn primary pick" id="btn-cam"><span>Cámara</span><input id="in-cam" type="file" accept="image/*" capture="environment" aria-label="Hacer foto con la cámara"></div>
        <div class="btn pick" id="btn-up"><span>Galería</span><input id="in-up" type="file" accept="image/*" aria-label="Elegir foto de la galería"></div>
      </div>
      <div id="panel" role="status" aria-live="polite"></div>
      <p id="diag" class="mono"></p>
    </section>

    <section id="v-inv" class="view" hidden>
      <div class="sec-h"><h2>Inventario</h2><span id="invSum" class="mono"></span></div>
      <div id="invGrid" class="inv"></div>
    </section>

    <section id="v-log" class="view" hidden>
      <div class="sec-h"><h2>Diario</h2><span id="logSum" class="mono"></span></div>
      <ul id="logList" class="log"></ul>
    </section>

    <section id="v-set" class="view" hidden>
      <div class="sec-h"><h2>Ajustes</h2><span id="setSum" class="mono"></span></div>
      <div class="card" id="acct">
        <h2>Cuenta</h2>
        <p class="sub" id="acctTxt">Comprobando…</p>
        <div class="row">
          <button class="btn primary" id="btnLogin" type="button" hidden>Entrar con Google</button>
          <button class="btn" id="btnLogout" type="button" hidden>Cerrar sesión</button>
        </div>
        <p class="sub warn" id="acctMsg" role="status"></p>
      </div>
      <div class="card">
        <h2>IA del escáner</h2>
        <div class="provs" id="provs">
          <label class="prov"><input type="radio" name="prov" id="p-visor" value="visor"><div><b>Claude (dentro de Claude)<em class="tag" id="visorTag"></em></b><span>Sin clave. Solo funciona al abrir la página dentro de Claude y si ese visor deja enviar fotos.</span></div></label>
          <label class="prov"><input type="radio" name="prov" id="p-gemini" value="gemini"><div><b>Google Gemini</b><span>Tiene nivel gratuito. Clave en Google AI Studio.</span></div></label>
          <label class="prov"><input type="radio" name="prov" id="p-anthropic" value="anthropic"><div><b>Claude por API</b><span>De pago por uso. Clave en la consola de Anthropic.</span></div></label>
          <label class="prov"><input type="radio" name="prov" id="p-openai" value="openai"><div><b>OpenAI</b><span>De pago por uso. Clave en la plataforma de OpenAI.</span></div></label>
        </div>
        <div id="keyBox" class="provs">
          <div class="field"><label for="f-key">Clave de API</label><input id="f-key" type="password" autocomplete="off" spellcheck="false" placeholder="Pega aquí tu clave"></div>
          <div class="field"><label for="f-model">Modelo</label><input id="f-model" type="text" autocomplete="off" spellcheck="false"></div>
          <p class="note" id="keyNote"></p>
        </div>
        <div class="row"><button class="btn primary" id="saveCfg" type="button">Guardar</button></div>
        <p class="ok-msg" id="cfgMsg" role="status"></p>
        <p class="note" id="keyWhere">La clave se guarda solo en este navegador y viaja directamente al proveedor elegido.</p>
      </div>
    </section>
  </main>
</div>

<nav class="tabs" aria-label="Secciones">
  <div class="in" role="tablist">
    <button class="tab" id="t-scan" role="tab" aria-selected="true" data-v="scan" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Escanear
    </button>
    <button class="tab" id="t-inv" role="tab" aria-selected="false" data-v="inv" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 8l9-4 9 4v9l-9 4-9-4z"/><path d="M3 8l9 4 9-4M12 12v9"/></svg>Inventario
    </button>
    <button class="tab" id="t-log" role="tab" aria-selected="false" data-v="log" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M8 4v16M11 8h5"/></svg>Diario
    </button>
    <button class="tab" id="t-set" role="tab" aria-selected="false" data-v="set" type="button">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Ajustes
    </button>
  </div>
</nav>

<script src="config.js"></script>
<script>
(function(){
'use strict';

/* ---------- Reglas del juego ---------- */
var MATS=[
  {id:'madera',n:'Madera'},{id:'metal',n:'Metal'},{id:'plastico',n:'Plástico'},{id:'vidrio',n:'Vidrio'},
  {id:'tela',n:'Tela'},{id:'papel',n:'Papel'},{id:'piedra',n:'Piedra'},{id:'goma',n:'Goma'},
  {id:'ceramica',n:'Cerámica'},{id:'electronica',n:'Electrónica'},{id:'organico',n:'Orgánico'},{id:'cuero',n:'Cuero'}
];
var MAT_BY={};MATS.forEach(function(m){MAT_BY[m.id]=m;});
var SIZES=[

async function prepareImage(file){
  if(!window.createImageBitmap)return file;
  var bmp=await createImageBitmap(file,{imageOrientation:'from-image'});
  var k=Math.min(1,1280/Math.max(bmp.width,bmp.height));
  var w=Math.max(1,Math.round(bmp.width*k)),h=Math.max(1,Math.round(bmp.height*k));
  var cv=document.createElement('canvas');cv.width=w;cv.height=h;
  cv.getContext('2d').drawImage(bmp,0,0,w,h);
  if(bmp.close)bmp.close();
  var b=await new Promise(function(r){cv.toBlob(r,'image/jpeg',0.86);});
  return b||file;
}
function sanitize(o){
  if(!o||typeof o!=='object'||Array.isArray(o))return {ok:false,motivo:'error'};
  if(o.valido===false||(o.valido!==true&&o.motivo&&o.motivo!=='ok'))return {ok:false,motivo:String(o.motivo||'no_objeto')};
  var nombre=clean(o.nombre,60);
  if(!nombre)return {ok:false,motivo:'no_objeto'};
  var clave=norm(o.clave||nombre)||norm(nombre);
  var cm=Number(o.dimension_cm);if(!isFinite(cm)||cm<=0)cm=20;cm=Math.min(cm,5000);
  var comp=Math.round(Number(o.complejidad));if(!(comp>=1))comp=2;comp=Math.min(4,comp);
  var mats=[];
  (Array.isArray(o.materiales)?o.materiales:[]).forEach(function(m){
    var id=String(m&&m.id||'').toLowerCase();
    if(MAT_BY[id]&&!mats.some(function(x){return x.id===id;})){
      var p=Number(m.peso);if(!(p>0))p=1;mats.push({id:id,peso:Math.min(p,10)});
    }
  });
  if(!mats.length)return {ok:false,motivo:'no_objeto'};
  return {ok:true,nombre:nombre,clave:clave,cm:cm,comp:comp,mats:mats.slice(0,4),dato:clean(o.dato,140)};
}
function distribute(mats,total){
  var sum=mats.reduce(function(a,m){return a+m.peso;},0);
  var g=mats.map(function(m){return {id:m.id,amt:Math.round(total*m.peso/sum),peso:m.peso};});
  var out=g.filter(function(x){return x.amt>0;});
  if(!out.length){
    var top=g.slice().sort(function(a,b){return b.peso-a.peso;})[0];
    out=[{id:top.id,amt:1}];
  }
  return out.sort(function(a,b){return b.amt-a.amt;});
}
function rejectText(m){
  if(m==='persona_o_animal')return 'Aquí no se escanean personas ni animales. Busca un objeto.';
  if(m==='pantalla')return 'Eso es una pantalla o una imagen. Fotografía el objeto real.';
  if(m==='no_objeto')return 'No distingo un objeto claro. Acércate, mejora la luz y encuadra una sola cosa.';
  return 'No he podido interpretar la foto. Prueba con otra.';
}
function errorText(code){
  switch(code){
    case 'not_granted':return 'Has rechazado el permiso para usar Claude. Recarga la página y acéptalo para escanear.';
    case 'sampling_disabled':case 'capability_disabled':case 'capability_removed':case 'not_declared':return 'Esta cuenta no puede usar Claude desde la página.';
    case 'images_unavailable':return 'Esta vista no puede enviar fotos a Claude.';
    case 'rate_limited':return 'Demasiados escaneos seguidos. Espera un momento y vuelve a intentarlo.';
    case 'image_rejected':return 'La imagen no es válida o pesa demasiado. Prueba con otra.';
    case 'refused':return 'No he podido analizar esa foto. Prueba con otro objeto.';
    case 'invalid_json':case 'empty_completion':return 'No he entendido la respuesta. Inténtalo otra vez.';
    case 'session_expired':return 'La sesión ha caducado. Vuelve a iniciar sesión en Claude.';
    case 'net':return 'No se pudo contactar con el proveedor. Si tienes la página abierta dentro de Claude, ábrela fuera; si no, revisa la conexión.';
    case 'auth':return 'La clave no es válida o no tiene permiso. Revísala en Ajustes.';
    case 'model':return 'Ese modelo no existe o no acepta imágenes. Cambia el nombre en Ajustes.';
    case 'quota':return 'Has agotado el cupo o el saldo del proveedor. Espera o revisa tu cuenta.';
    case 'bad':return 'El proveedor no ha devuelto una respuesta válida. Inténtalo otra vez.';
    default:return 'Fallo de conexión. Inténtalo de nuevo.';
  }
}
function showRejected(m){
  $('#vf').classList.remove('scan');
  setPanel('<div class="card"><h2>No cuenta</h2><p class="sub">'+esc(rejectText(m))+'</p><button class="btn primary" id="again" type="button">Probar con otro</button></div>');
  $('#again').addEventListener('click',function(){resetViewfinder();showIdle();});
}
function showError(code){
  $('#vf').classList.remove('scan');
  var canRetry=['auth','model','not_granted','sampling_disabled','capability_disabled','capability_removed','not_declared','images_unavailable','image_rejected','session_expired'].indexOf(code)<0;
  setPanel('<div class="card"><h2>No se pudo escanear</h2><p class="sub warn">'+esc(errorText(code))+'</p><div class="row">'+
    (canRetry&&lastBlob?'<button class="btn primary" id="retry" type="button">Reintentar</button>':'')+
    '<button class="btn" id="again" type="button">Otra foto</button></div></div>');
  $('#again').addEventListener('click',function(){resetViewfinder();showIdle();});
  var r=$('#retry');if(r)r.addEventListener('click',function(){scan(lastBlob);});
}
function applyScan(out){
  var r=sanitize(out);
  if(!r.ok){showRejected(r.motivo);return;}
  ensureDay();
  var prev=state.disc[r.clave];
  var n=prev&&prev.n?prev.n:0;
  var decay=Math.max(0.2,1-0.25*n);
  var size=sizeFor(r.cm),rar=RAR[r.comp-1];
  var total=size.base*rar.m*decay;
  var gains=distribute(r.mats,total);
  var units=gains.reduce(function(a,g){return a+g.amt;},0);
  var first=!prev;
  var xpGain=units+(first?5:0)+(r.comp-1)*2;
  var lvlBefore=levelFor(state.xp);
  var now=Date.now();
  var mats=Object.assign({},prev&&prev.mats||{});
  gains.forEach(function(g){state.inv[g.id]=(state.inv[g.id]||0)+g.amt;mats[g.id]=(mats[g.id]||0)+g.amt;});
  state.disc[r.clave]={nombre:r.nombre,tam:size.id,rar:r.comp,n:n+1,primero:prev&&prev.primero||now,ultimo:now,mats:mats};
  state.xp+=xpGain;
  state.day.n=(state.day.d===today()?state.day.n:0)+1;state.day.d=today();
  var lvlAfter=levelFor(state.xp);
  persist();
  renderAll();
  $('#vf').classList.remove('scan');
  var list=gains.map(function(g){
    return '<li><span class="sw mat-'+g.id+'"></span><span class="nm">'+MAT_BY[g.id].n+'</span><span class="qty">+'+g.amt+'</span></li>';
  }).join('');
  setPanel('<article class="card">'+
    '<div class="meta"><span class="pill r'+r.comp+'">'+rar.n+'</span><span class="sz">Talla '+size.id+' · '+fmtLen(r.cm)+'</span>'+(first?'<span class="new">Nuevo</span>':'')+'</div>'+
    '<h2 class="name">'+esc(r.nombre)+'</h2>'+
    (r.dato?'<p class="dato">'+esc(r.dato)+'</p>':'')+
    ladder(size.id)+
    '<ul class="gains">'+list+'</ul>'+
    '<p class="calc">'+size.base+' base × '+fmt(rar.m)+' rareza × '+fmt(decay)+' repetición</p>'+
    '<p class="xp">+'+xpGain+' XP</p>'+
    (lvlAfter>lvlBefore?'<p class="lvlup">Subes al nivel '+lvlAfter+'</p>':'')+
    '<button class="btn primary" id="again" type="button">Escanear otro objeto</button></article>');
  $('#again').addEventListener('click',function(){resetViewfinder();showIdle();});
}
async function scan(file){
  if(busy||!file)return;
  setPreview(file,false);
  if(!ready){setPanel('<div class="card"><p class="busy">Cargando tu taller</p><p class="sub">Espera unos segundos y vuelve a elegir la foto.</p></div>');return;}
  if(!aiOk){showIdle();return;}
  ensureDay();
  if(scansLeft()<=0){showIdle();return;}
  busy=true;setButtons();
  ctl=new AbortController();
  var blob=file;
  try{blob=await prepareImage(file);}catch(e){blob=file;}
  lastBlob=blob;
  setPreview(blob,true);
  setPanel('<div class="card"><p class="busy">Analizando el objeto</p><p class="sub">La primera vez, Claude te pedirá permiso. Acéptalo para escanear.</p><button class="btn" id="stop" type="button">Cancelar</button></div>');
  var stop=$('#stop'),c=ctl;
  stop.addEventListener('click',function(){c.abort();});
  try{
    var out=cfg.prov==='visor'
      ?await sampleFn.json(PROMPT,{images:blob,modelTier:'quick',signal:c.signal})
      :await identifyRemote(blob,c.signal);
    applyScan(out);
  }catch(e){
    if(e&&(e.code==='cancelled'||e.name==='AbortError')){resetViewfinder();showIdle();}
    else showError(e&&e.code);
  }finally{
    busy=false;ctl=null;setButtons();
  }
}

/* ---------- Proveedores externos ---------- */
function toB64(blob){
  return new Promise(function(res,rej){
    var fr=new FileReader();
    fr.onload=function(){var s=String(fr.result);res(s.slice(s.indexOf(',')+1));};
    fr.onerror=function(){rej({code:'image_rejected'});};
    fr.readAsDataURL(blob);
  });
}
function parseLoose(t){
  t=String(t||'');
  try{return JSON.parse(t);}catch(e){}
  var a=t.indexOf('{'),b=t.lastIndexOf('}');
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1));}catch(e){}}
  throw {code:'bad'};
}
function httpCode(status,body){
  var s=String(body||'').toLowerCase();
  if(status===401||status===403)return 'auth';
  if(status===429||s.indexOf('quota')>=0||s.indexOf('credit')>=0||s.indexOf('billing')>=0)return 'quota';
  if(status===404||s.indexOf('model')>=0)return 'model';
  if(status===400&&(s.indexOf('api key')>=0||s.indexOf('api_key')>=0))return 'auth';
  return 'upstream_error';
}
async function post(url,headers,body,signal){
  var r;
  try{r=await fetch(url,{method:'POST',headers:headers,body:JSON.stringify(body),signal:signal});}
  catch(e){if(e&&e.name==='AbortError')throw e;throw {code:'net'};}
  var txt=await r.text();
  if(!r.ok)throw {code:httpCode(r.status,txt)};
  try{return JSON.parse(txt);}catch(e){throw {code:'bad'};}
}
async function identifyRemote(blob,signal){
  var p=cfg.prov,key=clean(cfg.keys[p],400),model=modelOf(p);
  var mime=blob.type||'image/jpeg',data=await toB64(blob),j,t;
  if(p==='gemini'){
    j=await post('https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(model)+':generateContent',
      {'Content-Type':'application/json','x-goog-api-key':key},
      {contents:[{parts:[{text:PROMPT},{inline_data:{mime_type:mime,data:data}}]}],generationConfig:{responseMimeType:'application/json',temperature:0.2}},signal);
    t=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts||[];
    t=t.map(function(x){return x.text||'';}).join('');
  }else if(p==='anthropic'){
    j=await post('https://api.anthropic.com/v1/messages',
      {'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      {model:model,max_tokens:700,messages:[{role:'user',content:[{type:'image',source:{type:'base64',media_type:mime,data:data}},{type:'text',text:PROMPT}]}]},signal);
    t=(j&&j.content||[]).map(function(x){return x.text||'';}).join('');
  }else if(p==='openai'){
    j=await post('https://api.openai.com/v1/chat/completions',
      {'Content-Type':'application/json','Authorization':'Bearer '+key},
      {model:model,response_format:{type:'json_object'},messages:[{role:'user',content:[{type:'text',text:PROMPT},{type:'image_url',image_url:{url:'data:'+mime+';base64,'+data}}]}]},signal);
    t=j&&j.choices&&j.choices[0]&&j.choices[0].message&&j.choices[0].message.content||'';
  }else throw {code:'upstream_error'};
  return parseLoose(t);
}

/* ---------- Ajustes ---------- */
function renderSet(){
  var p=cfg.prov||'gemini';
  document.querySelectorAll('input[name="prov"]').forEach(function(r){r.checked=(r.value===p);});
  $('#visorTag').textContent=visorOk?'disponible aquí':'no disponible aquí';
  $('#visorTag').style.color=visorOk?'':'var(--ink-2)';
  $('#p-visor').closest('.prov').hidden=!window.claude;
  var P=PROVS[p];
  $('#keyBox').hidden=!P.key;
  if(P.key){
    $('#f-key').value=cfg.keys[p]||'';
    $('#f-model').value=cfg.models[p]||'';
    $('#f-model').placeholder=P.model;
    $('#keyNote').innerHTML='Consigue la clave en <a href="'+P.url+'" target="_blank" rel="noopener">'+P.where+'</a>. Deja el modelo vacío para usar '+esc(P.model)+'.';
  }
  $('#setSum').textContent=PROVS[cfg.prov]?PROVS[cfg.prov].n:'';
}
document.querySelectorAll('input[name="prov"]').forEach(function(r){
  r.addEventListener('change',function(){
    var keep=cfg.prov;cfg.prov=r.value;renderSet();cfg.prov=keep;
    $('#cfgMsg').textContent='';
  });
});
$('#saveCfg').addEventListener('click',function(){
  var sel=document.querySelector('input[name="prov"]:checked');
  var p=sel?sel.value:'gemini';
  cfg.prov=p;
  if(PROVS[p].key){
    cfg.keys[p]=clean($('#f-key').value,400);
    cfg.models[p]=clean($('#f-model').value,80);
  }
  refreshAi();renderSet();renderHeader();setButtons();showIdle();
  $('#cfgMsg').textContent='Guardando…';
  saveCfg().then(function(ok){
    var where=fb.user?' en tu cuenta':'';
    $('#cfgMsg').textContent=!ok?(fb.user?'No se pudo guardar en tu cuenta. Revisa la conexión.':'No se pudo guardar en este navegador; vale solo hasta que cierres la página.')
      :(aiOk?'Guardado'+where+'. IA lista: '+PROVS[p].n+'.':'Guardado'+where+', pero falta '+(p==='visor'?'abrir la página dentro de Claude':'la clave')+'.');
  });
});

/* ---------- Eventos ---------- */
function show(v){
  if(v==='set')renderSet();
  ['scan','inv','log','set'].forEach(function(k){
    $('#v-'+k).hidden=(k!==v);
    $('#t-'+k).setAttribute('aria-selected',k===v?'true':'false');
  });
  window.scrollTo(0,0);
}
document.querySelectorAll('.tab').forEach(function(b){b.addEventListener('click',function(){show(b.dataset.v);});});
document.addEventListener('paste',function(e){
  var items=(e.clipboardData&&e.clipboardData.files)||[];
  for(var i=0;i<items.length;i++){if(/^image\//.test(items[i].type)){scan(items[i]);break;}}
});
['#in-cam','#in-up'].forEach(function(id){
  $(id).addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];
    e.target.value='';
    if(f)scan(f);
  });
});

/* ---------- Arranque ---------- */
renderAll();showIdle();setButtons();
renderAcct();
Promise.all([withTimeout(initStore(),12000),withTimeout(initAI(),12000)]).then(function(){
  ready=true;
  renderAll();showIdle();setButtons();
  initFirebase();
});
})();
